[package]
name = "solana-vanity-grinder"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
bs58 = "0.4"
clap = { version = "4", features = ["derive"] }
curve25519-dalek = "3"
ed25519-dalek = "1"
getrandom = "0.2"
rand_chacha = "0.3"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.9"
